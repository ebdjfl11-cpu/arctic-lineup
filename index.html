<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCTIC BASEBALL CLUB LINEUP</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&family=Teko:wght@700&display=swap');
    
    :root {
      --gold: #dfb15b;
      --gold-dark: #b8860b;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #000000;
    }
    .panel-bg {
      background-color: #0f1115;
      border: 1px solid #1e232d;
    }
    .card-item {
      background-color: #161920;
      border: 1px solid #242a36;
    }
    .input-field {
      background-color: #0b0d11;
      border: 1px solid #282f3d;
      color: #f1f5f9;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--gold);
    }
    .jersey-num {
      font-family: 'Teko', sans-serif;
      line-height: 0.9;
    }
    .pos-card-box {
      border: 1.2px solid var(--gold);
      background-color: #000000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.9);
    }
    .pos-badge-circle {
      width: 19px;
      height: 19px;
      border: 1.2px solid var(--gold);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--gold);
      background: #000000;
      margin: 0 auto -6px auto;
      z-index: 10;
      position: relative;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0d11; }
    ::-webkit-scrollbar-thumb { background: #262c37; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-200 p-2 md:p-3 min-h-screen">
  <!-- 상단 관리자 모드 토글 버튼 (우측 상단 고정) -->
  <div class="max-w-[1550px] mx-auto flex justify-end mb-1.5 px-1">
    <button id="admin-mode-btn" onclick="toggleAdminMode()" class="text-[11px] bg-slate-800 text-slate-300 font-bold px-3 py-1.5 rounded-lg hover:text-white transition shadow border border-slate-700">
      🔒 관리자 모드
    </button>
  </div>

  <!-- 모바일 전용 최상단 탭 전환 메뉴 (관리자 모드 아닐 때 모바일에서만 노출) -->
  <div id="mobile-mode-tabs" class="max-w-[1550px] mx-auto flex lg:hidden gap-2 mb-3 px-1">
    <button id="m-tab-roster" onclick="switchMobileView('roster')" class="flex-1 py-2.5 rounded-xl font-black text-xs shadow transition text-center" style="background-color: var(--gold); color: #000000;">로스터</button>
    <button id="m-tab-lineup" onclick="switchMobileView('lineup')" class="flex-1 py-2.5 rounded-xl font-bold text-xs shadow transition text-center bg-slate-800 text-slate-400">라인업</button>
  </div>

  <div id="main-container" class="max-w-[1550px] mx-auto flex flex-wrap justify-center items-start gap-3">

    <!-- [COLUMN 1] ROSTER / 선수 명단 & 배번 현황 -->
    <div id="col-roster" class="w-full lg:w-[450px] panel-bg rounded-2xl p-4 flex flex-col h-[880px] shrink-0">
      <div class="flex justify-between items-center mb-3">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-black tracking-wider" style="color: var(--gold);">ROSTER</span>
            <span id="sync-status" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-500/40 px-1.5 py-0.5 rounded font-bold">● 실시간 연동중</span>
          </div>
          <div class="flex gap-1.5 mt-1.5">
            <button id="tab-btn-roster" onclick="switchRosterTab('roster')" class="px-3 py-1 font-black text-xs rounded-md shadow transition" style="background-color: var(--gold); color: #000000;">선수명단</button>
            <button id="tab-btn-numbers" onclick="switchRosterTab('numbers')" class="px-3 py-1 bg-slate-800 text-slate-400 font-bold text-xs rounded-md hover:text-slate-200 transition">배번현황</button>
          </div>
        </div>
        <button id="btn-open-register" onclick="openRegisterModal()" class="font-black px-3 py-2 rounded-lg text-xs flex items-center gap-1 shadow transition admin-only hidden" style="background-color: var(--gold); color: #000000;">
          <span>+</span> 선수 등록
        </button>
      </div>

      <div id="roster-tab-view" class="flex flex-col flex-1 min-h-0">
        <div class="space-y-2 mb-3">
          <div class="relative">
            <input type="text" id="player-search" oninput="filterRoster()" placeholder="이름 또는 등번호 검색" class="w-full input-field px-3 py-2 pl-8 rounded-lg text-xs placeholder-slate-500">
            <span class="absolute left-2.5 top-2 text-xs text-slate-500">🔍</span>
          </div>
          <select id="sort-select" onchange="sortRoster(this.value)" class="input-field px-2.5 py-1.5 rounded-lg text-xs text-slate-300 w-full">
            <option value="num">등번호순</option>
            <option value="name">이름순</option>
            <option value="pos">포지션순</option>
          </select>
        </div>
        <div id="roster-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1"></div>
      </div>

      <div id="numbers-tab-view" class="flex flex-col flex-1 min-h-0 hidden">
        <div class="flex justify-between items-center mb-2 px-1 text-[11px] text-slate-400">
          <span>0번 ~ 99번 배번 현황판 (10열 배치)</span>
          <span class="font-bold" style="color: var(--gold);" id="assigned-num-count">0명 배정됨</span>
        </div>
        <div class="flex-1 overflow-y-auto bg-black border border-slate-800 rounded-xl p-2">
          <div id="number-board-grid" class="grid grid-cols-10 gap-1 text-center select-none"></div>
        </div>
      </div>
    </div>

    <!-- [COLUMN 2] GAME & BATTING ORDER (관리자 모드일 때만 표시) -->
    <div id="col-game-order" class="w-full lg:w-[440px] panel-bg rounded-2xl p-4 flex flex-col h-[880px] overflow-hidden hidden shrink-0">
      <div class="border-b border-slate-800 pb-3 mb-3 shrink-0">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-black tracking-wider" style="color: var(--gold);">MATCH INFO</span>
          <span class="text-[11px] text-slate-500">관리자 전용 설정</span>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-2">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">우리팀</label>
            <input type="text" id="game-myteam" value="ARCTIC BASEBALL CLUB" oninput="debounceSaveGameInfo()" class="w-full input-field px-3 py-1.5 rounded-lg text-xs font-bold match-input">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">상대팀</label>
            <input type="text" id="game-opponent" placeholder="상대팀명 입력" oninput="debounceSaveGameInfo()" class="w-full input-field px-3 py-1.5 rounded-lg text-xs font-bold match-input">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">경기일</label>
            <input type="text" id="game-date" placeholder="2026.08.29" maxlength="10" oninput="handleDateInput(event); debounceSaveGameInfo();" class="w-full input-field px-2 py-1.5 rounded-lg text-xs text-center font-semibold match-input">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">시간</label>
            <input type="text" id="game-time" placeholder="07:00" oninput="debounceSaveGameInfo()" class="w-full input-field px-2 py-1.5 rounded-lg text-xs text-center font-semibold match-input">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">구장</label>
            <input type="text" id="game-place" placeholder="송도랜드마크야구장" oninput="debounceSaveGameInfo()" class="w-full input-field px-2.5 py-1.5 rounded-lg text-xs font-bold match-input">
          </div>
        </div>
      </div>

      <div class="flex-1 flex flex-col min-h-0">
        <div class="flex justify-between items-center mb-2 shrink-0">
          <div class="flex items-center gap-2">
            <span class="text-xs font-black tracking-wider" style="color: var(--gold);">BATTING ORDER</span>
            <span id="lineup-count" class="text-xs font-extrabold px-2.5 py-0.5 rounded-full" style="background-color: rgba(223,177,91,0.15); color: var(--gold);">0</span>
          </div>
          <button id="btn-clear-lineup" onclick="clearLineup()" class="text-xs text-slate-400 hover:text-rose-400 font-semibold transition admin-only">전체 비우기</button>
        </div>

        <div id="lineup-container" class="flex-1 rounded-xl border border-dashed border-slate-800 p-2 overflow-y-auto space-y-2">
          <div id="empty-lineup-msg" class="h-full flex flex-col items-center justify-center text-center py-20 text-slate-500 text-xs">
            <p class="font-bold text-slate-400 text-sm">선수를 출전 명단에 올려주세요</p>
            <p class="text-xs text-slate-600 mt-1.5">좌측 선수명단에서 [+]를 누르면 타순에 추가됩니다.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- [COLUMN 3] PREVIEW / 야구장 공유 보드 -->
    <div id="col-preview" class="w-full lg:w-[560px] panel-bg rounded-2xl p-2.5 flex flex-col shrink-0">
      <div id="capture-card" class="w-full bg-black rounded-xl p-2.5 flex flex-col gap-1 shadow-2xl relative select-none" style="border: 1px solid rgba(223,177,91,0.4);">
        
        <!-- 헤더 영역 -->
        <div class="shrink-0 pb-1 pt-0" style="border-bottom: 1px solid rgba(223,177,91,0.4);">
          <div class="flex justify-between items-start">
            <div>
              <h1 class="text-3xl font-black italic tracking-tighter drop-shadow-md leading-none" style="color: var(--gold);">LINE UP</h1>
              <p id="prev-myteam" class="text-xs font-black text-slate-300 tracking-[0.2em] mt-0.5 uppercase">ARCTIC BASEBALL CLUB</p>
              <div class="flex items-center gap-2 mt-1">
                <span class="px-2 py-0.5 font-black text-xs rounded leading-tight shadow" style="background-color: var(--gold); color: #000000;">VS</span>
                <span id="prev-match" class="text-sm font-black text-white tracking-wide">상대팀 미정</span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-3 mt-1 text-[11px] font-bold pt-1 border-t border-slate-800/80">
            <span id="prev-date" class="text-white tracking-wider font-extrabold">2026.08.29 (토) 07:00</span>
            <span class="font-bold" style="color: var(--gold);">|</span>
            <span id="prev-place" class="text-slate-200 tracking-wide">송도랜드마크야구장</span>
          </div>
        </div>

        <!-- 야구장 필드 -->
        <div class="relative w-full my-0 flex items-center justify-center overflow-hidden shrink-0" style="height: 305px;">
          <svg class="w-full h-full" viewBox="25 0 410 305" preserveAspectRatio="xMidYMid meet">
            <g transform="translate(0, -45)">
              <path d="M 50 135 A 235 235 0 0 1 410 135" stroke="var(--gold)" stroke-width="1.6" fill="none"/>
              <line x1="230" y1="315" x2="50" y2="135" stroke="var(--gold)" stroke-width="1.6"/>
              <line x1="230" y1="315" x2="410" y2="135" stroke="var(--gold)" stroke-width="1.6"/>
              <polygon points="230,154 298,228 230,302 162,228" stroke="var(--gold)" stroke-width="1.8" fill="#000000"/>
              <rect x="226" y="150" width="8" height="8" fill="var(--gold)" transform="rotate(45 230 154)"/>
              <rect x="294" y="224" width="8" height="8" fill="var(--gold)" transform="rotate(45 298 228)"/>
              <rect x="158" y="224" width="8" height="8" fill="var(--gold)" transform="rotate(45 162 228)"/>
              <circle cx="230" cy="228" r="14" stroke="var(--gold-dark)" stroke-width="1.2" fill="#000000"/>
              <rect x="226" y="226.5" width="8" height="3" fill="#ffffff"/>
              <polygon points="230,297 234,302 234,307 226,307 226,302" fill="#ffffff"/>

              <g id="svg-slot-CF" transform="translate(201, 48)"></g>
              <g id="svg-slot-LF" transform="translate(80, 94)"></g>
              <g id="svg-slot-RF" transform="translate(322, 94)"></g>
              <g id="svg-slot-SS" transform="translate(144, 132)"></g>
              <g id="svg-slot-2B" transform="translate(258, 132)"></g>
              <g id="svg-slot-3B" transform="translate(96, 200)"></g>
              <g id="svg-slot-1B" transform="translate(306, 200)"></g>
              <g id="svg-slot-P"  transform="translate(201, 202)"></g>
              <g id="svg-slot-C"  transform="translate(201, 284)"></g>
            </g>
          </svg>
        </div>

        <!-- 20칸 배팅 오더 고정 테이블 -->
        <div class="shrink-0 pt-1.5" style="border-top: 1px solid rgba(223,177,91,0.4);">
          <div class="text-center mb-0.5">
            <span class="text-[10px] font-black italic tracking-wider" style="color: var(--gold);">Betting Order</span>
          </div>
          <div id="order-table-grid" class="grid grid-cols-2 gap-x-2 p-0.5 bg-black" style="border: 1px solid rgba(223,177,91,0.6);"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 선수 등록 / 수정 모달 -->
  <div id="player-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="panel-bg w-full max-w-md rounded-2xl p-6 shadow-2xl relative" style="border: 1px solid rgba(223,177,91,0.4);">
      <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-800">
        <div>
          <span id="modal-sub-title" class="text-[10px] font-black tracking-wider" style="color: var(--gold);">ROSTER FORM</span>
          <h3 id="modal-main-title" class="text-lg font-bold text-white">선수 정보 등록</h3>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>

      <form id="player-form" onsubmit="handleSavePlayer(event)" class="space-y-4 text-xs">
        <input type="hidden" id="edit-player-id">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">이름 <span class="text-rose-400">*</span></label>
            <input type="text" id="inp-name" required placeholder="선수 이름" class="w-full input-field px-3 py-2 rounded-lg text-sm font-bold">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">배번 (0~99) <span class="text-rose-400">*</span></label>
            <input type="number" id="inp-no" required placeholder="등번호" min="0" max="99" class="w-full input-field px-3 py-2 rounded-lg text-sm font-bold">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">주 포지션 <span class="text-rose-400">*</span></label>
            <select id="inp-pos" class="w-full input-field px-3 py-2 rounded-lg text-xs font-semibold">
              <option value="투수">투수</option>
              <option value="포수">포수</option>
              <option value="내야수">내야수</option>
              <option value="외야수">외야수</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">직책</label>
            <select id="inp-role" class="w-full input-field px-3 py-2 rounded-lg text-xs font-semibold">
              <option value="일반">선택 안 함 (일반)</option>
              <option value="감독">감독</option>
              <option value="주장">주장</option>
              <option value="부주장">부주장</option>
              <option value="코치">코치</option>
              <option value="총무">총무</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">생년월일</label>
            <input type="text" id="inp-birth" placeholder="1995.05.20" maxlength="10" oninput="handleDateInput(event)" class="w-full input-field px-3 py-2 rounded-lg text-xs font-semibold">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">연락처</label>
            <input type="tel" id="inp-phone" placeholder="010-1234-5678" maxlength="13" oninput="handlePhoneInput(event)" class="w-full input-field px-3 py-2 rounded-lg text-xs font-semibold font-mono">
          </div>
        </div>

        <div class="flex gap-2 pt-4 border-t border-slate-800">
          <button type="button" id="btn-delete-player" onclick="handleDeletePlayer()" class="hidden px-4 py-2.5 bg-rose-950/60 hover:bg-rose-900 text-rose-300 font-bold rounded-lg text-xs transition">삭제</button>
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg text-xs transition">취소</button>
          <button type="submit" id="btn-save-submit" class="flex-1 py-2.5 font-black rounded-lg text-xs shadow-lg transition" style="background-color: var(--gold); color: #000000;">등록 완료</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 선수 상세 정보창 모달 -->
  <div id="info-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="panel-bg w-full max-w-sm rounded-2xl p-6 shadow-2xl relative" style="border: 1px solid rgba(223,177,91,0.5);">
      <button onclick="closeInfoModal()" class="absolute right-4 top-4 text-slate-400 hover:text-white text-lg font-bold">✕</button>
      
      <div class="flex items-center gap-4 border-b border-slate-800 pb-4 mb-4">
        <div id="info-badge-no" class="w-14 h-14 rounded-2xl bg-amber-500/10 flex items-center justify-center font-black text-2xl shadow-inner" style="border: 2px solid rgba(223,177,91,0.8); color: var(--gold);">--</div>
        <div>
          <div class="flex items-center gap-2">
            <h3 id="info-name" class="text-xl font-black text-white">--</h3>
            <span id="info-role" class="text-xs font-bold px-2 py-0.5 rounded" style="background-color: rgba(223,177,91,0.2); color: var(--gold); border: 1px solid rgba(223,177,91,0.3);"></span>
          </div>
          <p id="info-pos" class="text-xs text-slate-400 mt-0.5">--</p>
        </div>
      </div>

      <div class="space-y-3 text-xs">
        <div class="flex justify-between items-center bg-[#0b0d11] p-2.5 rounded-lg border border-slate-800">
          <span class="text-slate-400">생년월일</span>
          <span id="info-birth" class="font-semibold text-slate-200">미등록</span>
        </div>
        <div class="flex justify-between items-center bg-[#0b0d11] p-2.5 rounded-lg border border-slate-800">
          <span class="text-slate-400">연락처</span>
          <span id="info-phone" class="font-semibold font-mono" style="color: var(--gold);">미등록</span>
        </div>
        <div class="flex justify-between items-center bg-[#0b0d11] p-2.5 rounded-lg border border-slate-800">
          <span class="text-slate-400">선발 출전 여부</span>
          <span id="info-status" class="font-bold text-slate-400">대기중</span>
        </div>
      </div>

      <div class="mt-5 flex gap-2">
        <button id="info-edit-btn" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-lg text-xs transition">정보 수정</button>
        <button onclick="closeInfoModal()" class="flex-1 py-2.5 font-black rounded-lg text-xs transition" style="background-color: var(--gold); color: #000000;">확인</button>
      </div>
    </div>
  </div>

  <script>
    let isAdmin = sessionStorage.getItem('isAdmin') === 'true';

    // 모바일 뷰 전환 함수 (로스터 / 라인업)
    function switchMobileView(view) {
      const colRoster = document.getElementById('col-roster');
      const colPreview = document.getElementById('col-preview');
      const btnRoster = document.getElementById('m-tab-roster');
      const btnLineup = document.getElementById('m-tab-lineup');

      if (view === 'roster') {
        colRoster.style.display = 'flex';
        colPreview.style.display = 'none';
        btnRoster.style.backgroundColor = 'var(--gold)';
        btnRoster.style.color = '#000000';
        btnRoster.className = 'flex-1 py-2.5 rounded-xl font-black text-xs shadow transition text-center';
        btnLineup.style.backgroundColor = '';
        btnLineup.style.color = '';
        btnLineup.className = 'flex-1 py-2.5 rounded-xl font-bold text-xs shadow transition text-center bg-slate-800 text-slate-400';
      } else {
        colRoster.style.display = 'none';
        colPreview.style.display = 'flex';
        btnLineup.style.backgroundColor = 'var(--gold)';
        btnLineup.style.color = '#000000';
        btnLineup.className = 'flex-1 py-2.5 rounded-xl font-black text-xs shadow transition text-center';

    function handleDateInput(e) {
      let v = e.target.value.replace(/[^0-9]/g, '');
      if (v.length > 8) v = v.substring(0, 8);
      if (v.length > 4 && v.length <= 6) {
        e.target.value = v.substring(0, 4) + '.' + v.substring(4);
      } else if (v.length > 6) {
        e.target.value = v.substring(0, 4) + '.' + v.substring(4, 6) + '.' + v.substring(6);
      } else {
        e.target.value = v;
      }
    }

    function handlePhoneInput(e) {
      let v = e.target.value.replace(/[^0-9]/g, '');
      if (v.length > 11) v = v.substring(0, 11);
      if (v.length >= 4 && v.length <= 7) {
        e.target.value = v.substring(0, 3) + '-' + v.substring(3);
      } else if (v.length >= 8) {
        if (v.length === 11) {
          e.target.value = v.substring(0, 3) + '-' + v.substring(3, 7) + '-' + v.substring(7);
        } else {
          e.target.value = v.substring(0, 3) + '-' + v.substring(3, 6) + '-' + v.substring(6);
        }
      } else {
        e.target.value = v;
      }
    }

    function getDefaultSortedRoster() {
      const rolePriority = { '감독': 1, '주장': 2, '부주장': 3 };

      sorted.sort((a, b) => {
        const rA = rolePriority[a.role] || 99;
        const rB = rolePriority[b.role] || 99;
        if (rA !== rB) return rA - rB;
        return parseInt(a.no, 10) - parseInt(b.no, 10);
      });
      return sorted;
    }

      const name = document.getElementById('inp-name').value.trim();
      const no = document.getElementById('inp-no').value.trim();

        alert(`이미 ${duplicate.name} 선수가 [${no}번]을 사용 중입니다.`);
        return;
      }

      let defaultPos = 'DH';
      if (pos === '투수') defaultPos = 'P';
      else if (pos === '포수') defaultPos = 'C';
      else if (pos === '내야수') defaultPos = 'SS';
      else if (pos === '외야수') defaultPos = 'CF';

      if (editId) {
        const p = roster.find(item => item.id == editId);
        if (p) {
          p.name = name;
          p.no = no;
          p.pos = pos;
          p.role = role;
          p.birth = birth;
          p.phone = phone;

          const inL = lineup.find(l => l.id == editId);
          if (inL) {

        }
      } else {
        roster.push({
          id: Date.now(),
          no: no,
          name: name,
          pos: pos,
          role: role,
          birth: birth,
          phone: phone,
          defaultPos: defaultPos
        });
      }

      closeModal();
      updateViews();
      syncToServer();
    }

    function sortLineupByPosition() {
      const posOrder = { 'P': 1, 'SP': 1, 'RP': 1, 'C': 2, '1B': 3, '2B': 4, '3B': 5, 'SS': 6, 'LF': 7, 'CF': 8, 'RF': 9, 'DH': 10, '-': 11 };
      
      lineup.sort((a, b) => {
        const isSubA = a.orderPos === 'SUB';
        const isSubB = b.orderPos === 'SUB';

        if (isSubA && !isSubB) return 1;
        if (!isSubA && isSubB) return -1;
        if (isSubA && isSubB) {
          return a.name.localeCompare(b.name, 'ko');
        }

        const wA = posOrder[a.orderPos] || 99;
        const wB = posOrder[b.orderPos] || 99;
        return wA - wB;
      });
    }

      if (idx === -1) {
        lineup.push({
          ...player,

      sortLineupByPosition();
      updateViews();
      syncToServer();
    }

            <div class="flex gap-1 shrink-0">
              <button onclick="moveOrder(${i}, -1)" class="w-7 h-7 bg-slate-800 text-slate-300 hover:text-white rounded flex items-center justify-center text-xs font-bold">▲</button>
              <button onclick="moveOrder(${i}, 1)" class="w-7 h-7 bg-slate-800 text-slate-300 hover:text-white rounded flex items-center justify-center text-xs font-bold">▼</button>
              <button onclick="removeOrder(${i})" class="w-7 h-7 bg-rose-950/60 text-rose-300 hover:bg-rose-900 rounded flex items-center justify-center text-xs font-bold" title="타순에서 제외 (-)">-</button>
            </div>
          `;
        } else {
          controlsHtml = `
            <span class="text-xs font-bold px-3 py-1 rounded bg-black" style="border: 1px solid rgba(223,177,91,0.4); color: var(--gold);">${player.orderPos}</span>
          `;
        }

        row.innerHTML = `
          <span class="w-6 text-center font-black text-sm" style="color: ${isSub || isDash ? '#64748b' : 'var(--gold)'};">${orderDisplay}</span>
          <span class="w-9 text-center font-mono font-black text-xs text-slate-300 bg-slate-950 py-1 rounded border border-slate-800">${player.no}</span>
          <span class="flex-1 font-bold text-sm ${isSub ? 'text-slate-400' : 'text-white'} pl-1 truncate">${player.name}</span>
          ${controlsHtml}
        `;
        container.appendChild(row);
      });
    }

    function changePos(idx, newPos) {
      if (!isAdmin) return;
      lineup[idx].orderPos = newPos;
      sortLineupByPosition();
      updateViews();
      syncToServer();
    }

    function moveOrder(index, dir) {
      if (!isAdmin) return;
      const target = index + dir;
      if (target < 0 || target >= lineup.length) return;
      const temp = lineup[index];
      lineup[index] = lineup[target];
      lineup[target] = temp;
      updateViews();
      syncToServer();
    }

    function removeOrder(index) {
      if (!isAdmin) return;
      lineup.splice(index, 1);
      updateViews();
      syncToServer();
    }

    function clearLineup() {
      if (!isAdmin) return;
      lineup = [];
      updateViews();
      syncToServer();
    }

    let saveTimeout = null;
    function debounceSaveGameInfo() {
      if (!isAdmin) return;
      gameInfo.myTeam = document.getElementById('game-myteam').value;
      gameInfo.opp = document.getElementById('game-opponent').value;
      gameInfo.date = document.getElementById('game-date').value;
      gameInfo.time = document.getElementById('game-time').value;
      gameInfo.place = document.getElementById('game-place').value;

      renderGameInfoPreview();
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        syncToServer();
      }, 500);
    }

    function renderGameInfoPreview() {
      document.getElementById('prev-myteam').innerText = gameInfo.myTeam || 'ARCTIC BASEBALL CLUB';
      document.getElementById('prev-match').innerText = gameInfo.opp || '상대팀 미정';
      document.getElementById('prev-date').innerText = `${gameInfo.date || '2026.08.29'} ${gameInfo.time || '07:00'}`;
      document.getElementById('prev-place').innerText = gameInfo.place || '구장 미정';
    }

    function renderPreview() {
      const fieldSlots = [
        { id: 'svg-slot-CF', matches: ['CF'], label: 'CF' },
        { id: 'svg-slot-LF', matches: ['LF'], label: 'LF' },
        { id: 'svg-slot-RF', matches: ['RF'], label: 'RF' },
        { id: 'svg-slot-SS', matches: ['SS'], label: 'SS' },
        { id: 'svg-slot-2B', matches: ['2B'], label: '2B' },
        { id: 'svg-slot-3B', matches: ['3B'], label: '3B' },
        { id: 'svg-slot-1B', matches: ['1B'], label: '1B' },
        { id: 'svg-slot-P',  matches: ['P', 'SP', 'RP'], label: 'P' },
        { id: 'svg-slot-C',  matches: ['C'], label: 'C' }
      ];

      fieldSlots.forEach(slot => {
        const el = document.getElementById(slot.id);
        if (!el) return;

        const assigned = lineup.find(p => slot.matches.includes(p.orderPos));

        if (assigned) {
          el.innerHTML = `
            <circle cx="29" cy="10" r="10" fill="#000000" stroke="var(--gold)" stroke-width="1.2"/>
            <text x="29" y="13.5" fill="var(--gold)" font-size="10" font-weight="900" text-anchor="middle">${assigned.no}</text>
            <rect x="0" y="19" width="58" height="30" rx="3" fill="#000000" stroke="var(--gold)" stroke-width="1.2"/>
            <text x="29" y="30" fill="var(--gold)" font-size="9" font-weight="900" text-anchor="middle">${assigned.orderPos}</text>
            <text x="29" y="42" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">${assigned.name}</text>
          `;
        } else {
          el.innerHTML = `
            <circle cx="29" cy="10" r="10" fill="#000000" stroke="#64748b" stroke-width="1.2" opacity="0.6"/>
            <text x="29" y="13.5" fill="#64748b" font-size="10" font-weight="900" text-anchor="middle">-</text>
            <rect x="0" y="19" width="58" height="30" rx="3" fill="#000000" stroke="#64748b" stroke-width="1.2" opacity="0.6"/>
            <text x="29" y="30" fill="#64748b" font-size="9" font-weight="900" text-anchor="middle">${slot.label}</text>
            <text x="29" y="42" fill="#64748b" font-size="10" font-weight="900" text-anchor="middle">미지정</text>
          `;
        }
      });

      const tableGrid = document.getElementById('order-table-grid');
      tableGrid.innerHTML = '';

      const regularBatters = lineup.filter(p => p.orderPos !== 'SUB' && p.orderPos !== '-');
      const subPlayers = lineup.filter(p => p.orderPos === 'SUB' || p.orderPos === '-');

      const col1 = [];
      const col2 = [];

      for (let i = 0; i < 10; i++) {
        const p = regularBatters[i];
        if (p) {
          col1.push({ order: i + 1, name: p.name, pos: p.orderPos, isSub: false });
        } else {
          col1.push({ order: '', name: '', pos: '', isSub: false });
        }
      }

      for (let i = 0; i < 10; i++) {
        const p = subPlayers[i];
        if (p) {
          col2.push({ order: '-', name: p.name, pos: p.orderPos === '-' ? '-' : 'SUB', isSub: true });
        } else {
          col2.push({ order: '', name: '', pos: '', isSub: true });
        }
      }

      let col1Html = `<div class="space-y-[2px]">`;
      col1.forEach(item => {
        col1Html += `
          <div class="grid grid-cols-12 text-sm bg-[#0a0a0a] text-center font-bold h-[34px] items-center" style="border: 1px solid rgba(223,177,91,0.4);">
            <span class="col-span-2 leading-none" style="color: var(--gold); border-right: 1px solid rgba(223,177,91,0.4);">${item.order}</span>
            <span class="col-span-7 text-white truncate px-1.5 text-xs md:text-sm leading-none text-left pl-2.5 font-extrabold" style="border-right: 1px solid rgba(223,177,91,0.4);">${item.name}</span>
            <span class="col-span-3 text-xs leading-none font-extrabold" style="color: var(--gold);">${item.pos}</span>
          </div>
        `;
      });
      col1Html += `</div>`;

      let col2Html = `<div class="space-y-[2px]">`;
      col2.forEach(item => {
        col2Html += `
          <div class="grid grid-cols-12 text-sm bg-[#0a0a0a] text-center font-bold h-[34px] items-center" style="border: 1px solid rgba(223,177,91,0.4);">
            <span class="col-span-2 ${item.name ? '' : 'text-transparent'} leading-none" style="color: var(--gold); border-right: 1px solid rgba(223,177,91,0.4);">${item.order}</span>
            <span class="col-span-7 text-white truncate px-1.5 text-xs md:text-sm leading-none text-left pl-2.5 font-extrabold" style="border-right: 1px solid rgba(223,177,91,0.4);">${item.name}</span>
            <span class="col-span-3 ${item.name ? '' : 'text-transparent'} text-xs leading-none font-extrabold" style="color: var(--gold);">${item.pos}</span>
          </div>
        `;
      });
      col2Html += `</div>`;

      tableGrid.innerHTML = col1Html + col2Html;
    }

    function updateViews() {
      renderRoster();
      renderLineup();
      renderPreview();
      renderNumberBoard();
    }

    function sortRoster(type) {
      const rolePriority = { '감독': 1, '주장': 2, '부주장': 3 };
      const posPriority = { '투수': 1, '포수': 2, '내야수': 3, '외야수': 4 };

      roster.sort((a, b) => {
        const rA = rolePriority[a.role] || 99;
        const rB = rolePriority[b.role] || 99;
        if (rA !== rB) return rA - rB;

        if (type === 'num') {
          return parseInt(a.no, 10) - parseInt(b.no, 10);
        } else if (type === 'name') {
          return a.name.localeCompare(b.name, 'ko');
        } else if (type === 'pos') {
          const pA = posPriority[a.pos] || 99;
          const pB = posPriority[b.pos] || 99;
          if (pA !== pB) return pA - pB;
          return parseInt(a.no, 10) - parseInt(b.no, 10);
        }
        return 0;
      });
      renderRoster(roster);
    }

    function filterRoster() {
      const query = document.getElementById('player-search').value.trim();
      if (!query) {
        renderRoster(null);
        return;
      }
      const filtered = roster.filter(p => p.name.includes(query) || p.no.includes(query));
      renderRoster(filtered);
    }

    // 초기 실행 시 권한 상태 반영
    checkAdminMode();
    renderGameInfoPreview();
  </script>
</body>
</html>
